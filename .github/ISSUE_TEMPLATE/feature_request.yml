name: Feature request
description: Propose a new encoding, option or function
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like charigo to do, with a short Lua example of the call you have in mind.
    validations:
      required: true
  - type: input
    id: affected
    attributes:
      label: Encoding or API affected
      placeholder: "convert, detect(), a new encoding name"
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to contribute this?
      options:
        - "Yes, I can open a pull request"
        - "Yes, with some guidance"
        - "No, I am only reporting the need"
    validations:
      required: true
