name: Bug report
description: Report wrong output, a wrong error or a crash
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: charigo version
      description: The value of `charigo._VERSION`, or the commit hash if you built from the tree.
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Lua runtime
      options:
        - Lua 5.1
        - Lua 5.2
        - Lua 5.3
        - Lua 5.4
        - LuaJIT
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short Lua snippet that shows the problem. Use escapes such as `\226\130\172` for non-ASCII bytes.
      render: lua
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The output or the full error message.
    validations:
      required: true
