name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua:
          - "5.1"
          - "5.2"
          - "5.3"
          - "5.4"
          - "luajit-openresty"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lua ${{ matrix.lua }}
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}

      - name: Symlink luajit to lua (LuaJIT cells only)
        if: contains(matrix.lua, 'luajit')
        run: |
          set -euo pipefail
          luajit_path="$(command -v luajit)"
          echo "Linking ${luajit_path} -> /usr/local/bin/lua"
          sudo ln -sf "${luajit_path}" /usr/local/bin/lua
          lua -v

      - name: Run tests against the source tree
        run: lua tests/run.lua

      - name: Build the bundled distribution
        run: lua build.lua

      - name: Run tests against the bundle
        run: lua tests/run.lua dist

      - name: Upload the bundle
        if: matrix.lua == '5.4'
        uses: actions/upload-artifact@v4
        with:
          name: charigo-lua
          path: dist/charigo.lua
          if-no-files-found: error
